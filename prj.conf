# Logger module
CONFIG_LOG=n #disabled logging for power efficiency
CONFIG_NCS_SAMPLES_DEFAULTS=n

#ENABLING CONFIG_ADC
CONFIG_ADC=y

# BLE Buffer and MTU Configuration - Increased for large data packets
CONFIG_BT_L2CAP_TX_BUF_COUNT=16
CONFIG_BT_ATT_PREPARE_COUNT=4
CONFIG_BT_CONN_TX_MAX=16
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251

#RUNTIME REPORT 
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_ANALYZER_AUTO=n
CONFIG_THREAD_ANALYZER_USE_PRINTK=y

# Button and LED library
CONFIG_DK_LIBRARY=y

# Bluetooth LE
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="PIBiomed_Nordic_CB_1"

# Increase stack size for the main thread and System Workqueue
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048

# BLE Stack Configuration - CRITICAL for callbacks
CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_BT_HCI_TX_STACK_SIZE=1536

# Debug symbols for better reverse engineering
CONFIG_DEBUG=n
CONFIG_DEBUG_OPTIMIZATIONS=n
CONFIG_DEBUG_INFO=n # enable when activelt debugging 
#SPI Enable
CONFIG_SPI=y

# Internal flash storage for command_buffer persistence
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y

#Power optimization
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

#Request Low Power Connection Parameters
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=100
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=120
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=200
CONFIG_BT_PERIPHERAL_PREF_LATENCY=2

